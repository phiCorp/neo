<!DOCTYPE html>
<html lang="en" data-neo-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo UI - Inputs</title>
    <link rel="stylesheet" href="../libs/css/neo.all.css">
    <link rel="stylesheet" href="neo-ui.button.css">
    <style>
        .button-box {
            margin: 50px auto;
            width: 80%;
            padding: 20px;
            background-color: var(--neo-color-foreground);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="button-box">
            <h2>Buttons</h2>
            <div class="row p-4">
                <div class="col-2 p-3">
                    <button class="button primary">Primary</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button success">success</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button alert">alert</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button idle">idle</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button white">white</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button black">black</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button outline">Outline</button>
                </div>
                <div class="col-2 p-3">
                    <button class="button disabled" disabled>Disabled</button>
                </div>
            </div>
            <h2>Buttons (bt-round)</h2>
            <div class="row p-4">
                <div class="col-2 p-3">
                    <button class="button primary bt-round">Primary</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button success bt-round">success</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button alert bt-round">alert</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button idle bt-round">idle</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button white bt-round">white</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button black bt-round">black</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button outline bt-round">Outline</button>
                </div>
                <div class="col-2 p-3">
                    <button class="button disabled bt-round" disabled>Disabled</button>
                </div>
            </div>
            <h2>Buttons (bt-pill)</h2>
            <div class="row p-4">
                <div class="col-2 p-3">
                    <button class="button primary bt-pill">Primary</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button success bt-pill">success</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button alert bt-pill">alert</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button idle bt-pill">idle</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button white bt-pill">white</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button black bt-pill">black</button>
                </div>
                <br>
                <div class="col-2 p-3">
                    <button class="button outline bt-pill">Outline</button>
                </div>
                <div class="col-2 p-3">
                    <button class="button disabled bt-pill" disabled>Disabled</button>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
